<style>

t:500}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.tile{text-align:left;border-bottom:1px solid var(--line);padding:10px 0}.tile b{display:block;font-weight:500;font-size:21px}.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:12px 0 2px}.scale span{height:7px;background:#ddd}.scale span:nth-child(1){background:#34725b}.scale span:nth-child(2){background:#baa45e}.scale span:nth-child(3){background:#a36528}.scale span:nth-child(4){background:#a44138}.scale span.current{outline:1px solid #191919;outline-offset:3px}.scale-label{display:flex;justify-content:space-between;font-size:10px;color:#666}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}.calendar>*{background:white;text-align:center;min-width:0}.calendar .weekday{font-size:10px;color:#666;padding:4px 0}.calendar button{min-height:42px;padding:4px 0;font-size:13px}.calendar button b{display:block;font-size:9px;color:#555;font-weight:400}.calendar button.has{background:#f1f1f1}.calendar button:hover{background:#ddd}.month button{border:1px solid #aaa;min-width:34px;min-height:34px}.progress{display:flex;gap:3px;margin:10px 0}.progress span{height:5px;flex:1;background:#ddd}.progress .done{background:#444}.progress .active{background:#a36528}.assetbar{display:flex;height:10px;gap:2px;margin:14px 0}.assetbar span:nth-child(1){background:#444}.assetbar span:nth-child(2){background:#888}.assetbar span:nth-child(3){background:#ccc}.chart{display:block;width:100%;height:auto;margin:10px 0}.legend{display:flex;gap:10px;flex-wrap:wrap;color:#555;font-size:11px}.legend i{display:inline-block;width:13px;border-top:2px solid #222;margin-right:4px;vertical-align:middle}.legend i.dashed{border-top:2px dashed #999}.demo{border-bottom:1px solid #999;padding:2px 0;font-size:11px;color:#555}.plain{padding:0;text-align:left}.plain:hover{text-decoration:underline}.outline{border:1px solid #222;padding:8 <nav role="tablist" aria-label="업무 공간" aria-orientation="vertical"><button role="tab" id="tab-field" aria-controls="field" aria-selected="true">필드</button><button role="tab" id="tab-lab" aria-controls="lab" aria-selected="false" tabindex="-1">랩</button><button role="tab" id="tab-office" aria-controls="office" aria-selected="false" tabindex="-1">오피스</button></nav>
<main><header><span>QUANTRADE</span><button class="demo" data-detail="system">예시 데이터 · 미연결</button></header>

<div class="section"><h2>기관 운영</h2><button class="item" data-detail="inbox"><span>안건 · 업무 지시</span><span class="chev">›</span></button><button class="item" data-detail="reports"><span>보고서 · 기록</span><span class="chev">›</span></button></div></section></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="sheet"><div class="sheet-head"><h2 id="detail-title"></h2><button class="close" aria-label="닫기">×</button></div><div id="detail-body"></div></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), tabs=[...document.querySelectorAll('[role=tab]')], detail=$('#detail'); let opener=null, scroll=0;
function select(tab){tabs.forEach(t=>{const yes=t===tab;t.setAttribute('aria-selected',String(yes));t.tabIndex=yes?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!yes});window.scrollTo(0,0)}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>select(t));t.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowDown'?1:-1)+tabs.length)%tabs.length;select(tabs[j]);tabs[j].focus()}})});
const data={
system:['시스템 상태','<p>이 화면은 독립 UI 검토용입니다. 모든 수치·진행 단계는 합성 또는 예시이며 실제 계좌·시세와 연결되지 않았습니다.</p><p>읽기 전용 · 외부 요청 없음 · 주문 기능 없음.</p>'],
regime:['시장 위험','<p class="metric warn">방어 준비 · 3/4</p><p>표시 방식의 예시입니다. 실제 위험 단계는 검증된 판정 규칙과 최신 자료가 연결될 때만 표시합니다.</p><p>변동성 · 신용 위험 · 유동성 · 추세의 세부 근거는 연결 전입니다.</p>'],
kospi:['KOSPI','<p class="metric up">+0.82%</p><p>가상 등락률 · 실시간 가격 및 출처 미연결.</p>'],
nasdaq:['NASDAQ','<p class="metric down">−1.24%</p><p>가상 등락률 · 실시간 가격 및 출처 미연결.</p>'],
vix:['VIX','<p class="metric warn">25.40</p><p>가상 변동성 지수 · 실제 위험 판정 및 시계열 미연결.</p>'],
fx:['원/달러','<p class="metric">1,460.20</p><p>가상 환율 · 실제 관측 시각 및 출처 미연결.</p>'],
watch:['가상 종목 A','<p>검토가 대비 −4.2% · 합성 예시.</p><p>가격·가치 평가 기준·유효기간·판정 근거는 실제 데이터 연결 후 표시합니다. 매수 권고가 아닙니다.</p>'],
watch2:['가상 종목 B','<p>검토가 대비 +0.4% · 합성 예시.</p><p>조건 접근 표현의 예시이며 실제 매수 신호가 아닙니다.</p>'],
archive:['연구 자료','<p>연구별 계획서, 원천 자료, 실험 결과와 실패 기록을 연결할 공간입니다. 현재는 파일 연결 전입니다.</p>'],
assets:['자산 변동','<p>기초 순자산 ₩1,000,000</p><p>순입금 ₩300,000</p><p>투자 손익 +₩152,000</p><p>기말 순자산 ₩1,452,000</p><p class="muted">합성 검증 사례. 중간 그래프 점은 화면 디자인용이며 실제 계좌 기록이 아닙니다.</p>'],
performance:['투자 성과','<p>시간가중수익률 +14.95%</p><p>표본 최대낙폭 −5.00%</p><p>합성 검증 사례. 실제 성과 및 연속 관측 최대낙폭이 아닙니다.</p>'],
allocation:['자산 구성','<p>미국 주식 45% · 국내 주식 35% · 현금 20%</p><p>별도 구성비 예시. 실제 계좌별 잔액 및 환율은 미연결입니다.</p>'],
inbox:['안건 · 업무 지시','<p>승인 요청, 보류 사유, 다음 업무를 표시할 영역입니다. 실제 업무 원장 미연결.</p>'],
reports:['보고서 · 기록','<p>일일 업무 보고, 투자 판단 기록, 매매 복기 연결 전.</p>']};
const projects=[['장기 이동평균선 기반 투자법','자료 수집·실험 설계·백테스트·독립 검증·편입 심사',143],['시장 국면 복합지수','원천 데이터·가설·실증·독립 검증·편입 심사',135],['인간 심리 역지표 연구','발언 원장·분류·수익률 검증·독립 검증·편입 심사',139],['BNF 25일 이격도 연구','데이터 권리·표본 구성·백테스트·독립 검증·편입 심사',133]];
projects.forEach((p,i)=>{const key='research'+i,steps=p[1].split('·');data[key]=[p[0],'<p>연구 계획 및 검증 단계의 표시 예시.</p><ol>'+steps.map(s=>'<li>'+s+' <small>미확인</small></li>').join('')+'</ol><p>참조 GitHub #'+p[2]+' · 원장 연결 전.</p>'];const b=document.createElement('button');b.className='item';b.dataset.detail=key;b.innerHTML='<span><strong>'+p[0]+'</strong><small>검증 단계 미연결</small><span class="progress" aria-label="실제 진척 미확인">'+steps.map(()=>'<span></span>').join('')+'</span></span><span class="chev">›</span>';$('#research').append(b)});
function openDetail(title,body,trigger){opener=trigger;scroll=window.scrollY;$('#detail-title').textContent=title;$('#detail-body').innerHTML=body;document.body.classList.add('modal');detail.showModal();$('.close').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-detail]');if(b&&data[b.dataset.detail])openDetail(...data[b.dataset.detail],b)});
$('.close').addEventListener('click',()=>detail.close());detail.addEventListener('click',e=>{if(e.target===detail)detail.close()});detail.addEventListener('close',()=>{document.body.classList.remove('modal');if(opener)opener.focus({preventScroll:true});window.scrollTo(0,scroll)});
const events={'2026-12-02':[['00:00','JOLTS']], '2026-12-04':[['22:30','고용보고서']], '2026-12-10':[['04:00','FOMC'],['04:30','기자회견'],['22:30','CPI']], '2026-12-15':[['22:30','PPI']], '2026-12-23':[['22:30','PCE']]};let year=2026,month=11;
function renderCalendar(){const cal=$('#calendar');cal.replaceChildren();$('#month-label').textContent=year+'년 '+(month+1)+'월';for(const d of ['월','화','수','목','금','토','일']){const s=document.createElement('span');s.className='weekday';s.textContent=d;cal.append(s)}const offset=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate();for(let j=0;j<offset;j++)cal.append(document.createElement('span'));for(let d=1;d<=days;d++){const key=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'), ev=events[key]||[],b=document.createElement('button');b.textContent=d;b.setAttribute('aria-label',key+' 예시 일정 '+ev.length+'건');if(ev.length){b.className='has';const s=document.createElement('b');s.textContent=ev.length===1?ev[0][1]:ev.length+'건';b.append(s)}b.addEventListener('click',()=>openDetail(key,ev.length?ev.map(x=>'<p>'+x[0]+' KST · '+x[1]+'</p>').join('')+'<p class="muted">사진을 바탕으로 한 예시 일정. 공식 재검증 전.</p>':'<p>등록된 예시 일정 없음.</p>',b));cal.append(b)}}
function shift(n){const d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();renderCalendar()}$('#prev').addEventListener('click',()=>shift(-1));$('#next').addEventListener('click',()=>shift(1));renderCalendar();
</script></body></html>
