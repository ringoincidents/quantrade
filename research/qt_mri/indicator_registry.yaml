# QT-MRI candidate indicator registry — G0 research metadata
# NOT LIVE DATA. Source URLs and identities are candidates unless status explicitly says confirmed.
# No forecast, trade or production authority. Registry version 0.1, 2026-11-22 KST.
registry_id: "QT-MRI-G0-INDICATORS-V0.1"
research_issue: "https://github.com/ringoincidents/quantrade/issues/135"
phase: "G0_SOURCE_PREFLIGHT_ONLY"
status: "CANDIDATE_NO_DATA_INGESTED"
base_timezone: "America/New_York"
known_facts:
  - "FRED SP500 daily historical window is only ~10 years; cannot satisfy 2000-2025 target by itself."
  - "ICE BofA HY OAS FRED starts 2023-11-21 as of 2026-11-22 due to April 2026 rolling ~3-year availability; 2000-2025 direct-HY study is BLOCKED without licensed historical source."\n  - "Moody BAA10Y daily series begins 1986-01-02 but is investment-grade Baa vs Treasury, NOT high-yield OAS; Moody copyright/redistribution restrictions apply."\n  - "FRED publisher pages may display observation date earlier than first publication; historical first_public_at_utc is NOT inferred from that date."
  - "FRED/ALFRED vintage queries alone do not automatically prove intraday availability; verify release timing and historical vintage coverage."
  - "US stock close, Korea market close, oil spot/futures and macro release have distinct timestamps and calendars."
  - "Existing QuanTrade market_indicators.py explicitly rejects composite scores and market regime labels in production; do not change without a governed decision."
required_per_observation:
  - "series_id"
  - "observation_date"
  - "observation_value"
  - "unit"
  - "source_url"
  - "source_version"
  - "first_public_at_utc"
  - "retrieved_at_utc"
  - "vendor_or_copyright_owner"
  - "vintage_id_if_revised"
  - "quality_and_missing_reason"
  - "effective_for_signal_at_utc"
