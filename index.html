<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 포트폴리오 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0f1115; color: #eee; padding: 12px; margin: 0; }
  h2 { color: #7dd3fc; font-size: 20px; }
  h3 { color: #a5b4fc; font-size: 15px; margin-bottom: 8px; }
  .card { background: #1a1d24; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .pos { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2d35; font-size: 14px; }
  .pos:last-child { border-bottom: none; }
  .positive { color: #4ade80; }
  .negative { color: #f87171; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
  .badge-conviction { background: #78350f; color: #facc15; }
  .badge-strategy { background: #1e293b; color: #94a3b8; }
  .pending-card { background: #292116; border: 1px solid #78350f; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; margin-right: 6px; margin-top: 8px; }
  .btn-approve { background: #16a34a; color: white; }
  .btn-reject { background: #dc2626; color: white; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; }
  #summary-text { font-size: 14px; line-height: 1.5; color: #cbd5e1; }
  .cash-line { font-size: 16px; font-weight: bold; }
</style>
</head>
<body>
<h2>📊 내 포트폴리오</h2>

<div class="card">
  <div class="cash-line" id="cash-summary">로딩 중...</div>
</div>

<div class="card">
  <h3>🤖 최근 AI 시장 요약</h3>
  <div id="summary-text"></div>
</div>

<div class="card" id="pending-section" style="display:none;">
  <h3>⏳ 승인 대기 중인 매도</h3>
  <div id="pending-list"></div>
</div>

<div class="card">
  <h3>보유 비중 (전체 자산 대비)</h3>
  <canvas id="pieChart"></canvas>
</div>

<div class="card">
  <h3>종목별 현재 수익률</h3>
  <div id="positions-list"></div>
</div>

<div class="card">
  <h3>💎 확신 장기보유 종목</h3>
  <div id="conviction-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

function copyCommand(cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    showToast('복사됨! 텔레그램에 붙여넣으세요 📋');
  });
}
