<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 포트폴리오 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0f1115; color: #eee; padding: 12px; margin: 0; }
  h2 { color: #7dd3fc; font-size: 20px; }
  h3 { color: #a5b4fc; font-size: 15px; margin-bottom: 8px; }
  .card { background: #1a1d24; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .pos { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2d35; font-size: 14px; }
  .pos:last-child { border-bottom: none; }
  .positive { color: #4ade80; }
  .negative { color: #f87171; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
  .badge-conviction { background: #78350f; color: #facc15; }
  .badge-strategy { background: #1e293b; color: #94a3b8; }
  .pending-card { background: #292116; border: 1px solid #78350f; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; margin-right: 6px; margin-top: 8px; }
  .btn-approve { background: #16a34a; color: white; }
  .btn-reject { background: #dc2626; color: white; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; }
  #summary-text { font-size: 14px; line-height: 1.5; color: #cbd5e1; }
  .cash-line { font-size: 16px; font-weight: bold; }
</style>
</head>
<body>
<h2>📊 내 포트폴리오</h2>

<div class="card">
  <div class="cash-line" id="cash-summary">로딩 중...</div>
</div>

<div class="card">
  <h3>🤖 최근 AI 시장 요약</h3>
  <div id="summary-text"></div>
</div>

<div class="card" id="pending-section" style="display:none;">
  <h3>⏳ 승인 대기 중인 매도</h3>
  <div id="pending-list"></div>
</div>

<div class="card">
  <h3>보유 비중 (전체 자산 대비)</h3>
  <canvas id="pieChart"></canvas>
</div>

<div class="card">
  <h3>종목별 현재 수익률</h3>
  <div id="positions-list"></div>
</div>

<div class="card">
  <h3>💎 확신 장기보유 종목</h3>
  <div id="conviction-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

function copyCommand(cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    showToast('복사됨! 텔레그램에 붙여넣으세요 📋');
  });
}

async function loadData() {
  const bust = '?t=' + Date.now();
  const portfolio = await (await fetch('portfolio.json' + bust)).json();
  let lastReport = {};
  try {
    lastReport = await (await fetch('last_report.json' + bust)).json();
  } catch(e) {}

  const totalAssets = portfolio.cash + portfolio.positions.reduce((s, p) => s + p.amount_krw, 0);
  document.getElementById('cash-summary').innerHTML =
    `💰 총자산 약 ${totalAssets.toLocaleString()}원 &nbsp;|&nbsp; 현금 ${portfolio.cash.toLocaleString()}원`;

  document.getElementById('summary-text').textContent = lastReport.market_summary || '아직 데이터 없음';

  // 승인 대기 섹션
  const pending = lastReport.pending || [];
  if (pending.length > 0) {
    document.getElementById('pending-section').style.display = 'block';
    document.getElementById('pending-list').innerHTML = pending.map(a => `
      <div class="pending-card">
        <div><b>${a.market}</b></div>
        <div style="font-size:13px; color:#cbd5e1; margin-top:4px;">${a.reasoning}</div>
        <button class="btn btn-approve" onclick="copyCommand('/approve ${a.id}')">승인 명령어 복사</button>
        <button class="btn btn-reject" onclick="copyCommand('/reject ${a.id}')">거절 명령어 복사</button>
      </div>
    `).join('');
  }

  // 비중 파이차트 (현금 포함)
  const nonConviction = portfolio.positions;
  const pieLabels = ['현금', ...nonConviction.map(p => p.market)];
  const pieData = [portfolio.cash, ...nonConviction.map(p => p.amount_krw)];
  new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: pieLabels,
      datasets: [{ data: pieData, backgroundColor: ['#475569', '#f87171', '#fb923c', '#facc15', '#4ade80', '#22d3ee', '#818cf8', '#e879f9'] }]
    },
    options: { plugins: { legend: { position: 'bottom', labels: { color: '#eee', font: { size: 11 } } } } }
  });

  // 종목별 수익률 리스트 (확신종목 제외)
  const activePositions = portfolio.positions.filter(p => !p.conviction);
  document.getElementById('positions-list').innerHTML = activePositions.map(p => {
    const ret = p.current_return || 0;
    const cls = ret >= 0 ? 'positive' : 'negative';
    return `<div class="pos">
      <span>${p.market} <span class="badge badge-strategy">${p.strategy_type || '-'}</span></span>
      <span class="${cls}">${ret >= 0 ? '+' : ''}${ret.toFixed(2)}%</span>
    </div>`;
  }).join('') || '<p style="color:#64748b;">보유 종목 없음</p>';

  // 확신종목 리스트
  const convictionPositions = portfolio.positions.filter(p => p.conviction);
  document.getElementById('conviction-list').innerHTML = convictionPositions.map(p => {
    const ret = p.current_return || 0;
    const cls = ret >= 0 ? 'positive' : 'negative';
    return `<div class="pos">
      <span>${p.market} <span class="badge badge-conviction">💎 확신</span></span>
      <span class="${cls}">${ret >= 0 ? '+' : ''}${ret.toFixed(2)}%</span>
    </div>`;
  }).join('') || '<p style="color:#64748b;">지정된 확신종목 없음</p>';
}
loadData();
</script>
</body>
</html>
