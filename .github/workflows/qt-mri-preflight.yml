name: QT-MRI research-only preflight
on:
  push:
    branches: [research/qt-mri-g0-preflight-20261122]
    paths: ['research/qt_mri/**', '.github/workflows/qt-mri-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/qt_mri -p 'test_*.py' -v
