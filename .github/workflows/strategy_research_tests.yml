name: Strategy Research Capability Tests

on:
  pull_request:
    paths:
      - "quantrade/capabilities/**"
      - "tests/capabilities/**"
      - "scripts/run_strategy_research_evaluation.py"
      - "scripts/run_strategy_candidate_evaluation.py"
      - "scripts/run_strategy_robustness_evaluation.py"
      - "research/precedents/2026-10-05_STRATEGY_RESEARCH_SANDBOX_*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile capability modules
        run: python -m compileall -q quantrade/capabilities tests/capabilities scripts
      - name: Run strategy research capability tests
        run: python -m unittest discover -s tests/capabilities -p "test_strategy_*.py" -v
      - name: Run deterministic strategy research harness
        run: python -m scripts.run_strategy_research_evaluation > /tmp/strategy-research.json
      - name: Run safe candidate harness
        run: python -m scripts.run_strategy_candidate_evaluation > /tmp/strategy-candidates.json
      - name: Run robustness review harness
        run: python -m scripts.run_strategy_robustness_evaluation > /tmp/strategy-robustness.json
