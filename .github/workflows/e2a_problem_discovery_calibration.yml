name: E2-A Problem Discovery Calibration Wave 2

on:
  pull_request:
    types: [synchronize]
    branches:
      - architecture/p0-5-gap-audit
    paths:
      - .github/workflows/e2a_problem_discovery_calibration.yml

permissions:
  contents: read

jobs:
  e2a-calibration:
    # Restrict the live run to the original restart transition.
    # Later documentation commits must not consume provider quota.
    if: github.event.before == '1de23e4695afd5b375c764f86e8d4e860f941f03'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require experiment secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is not configured."
            exit 2
          fi
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Require grading and anti-leakage tests before live quota
        run: python -m unittest discover -s tests/institutional -p "test_*.py" -v
      - name: Run E2-A three-treatment calibration
        run: |
          python scripts/run_e2a_live.py \
            --repeats 1 \
            --model gemini-3.5-flash-lite \
            --pace-seconds 20 \
            --db e2a_calibration_wave2.sqlite3 \
            --report e2a_calibration_wave2_report.json
      - name: Upload calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2a-problem-discovery-calibration-wave2
          path: |
            e2a_calibration_wave2.sqlite3
            e2a_calibration_wave2_report.json
          if-no-files-found: warn
          retention-days: 30

