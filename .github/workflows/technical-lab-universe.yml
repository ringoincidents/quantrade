name: Technical Lab full universe research
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  universe:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'technical-lab-universe'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public source snapshot only
        run: |
          git init "$RUNNER_TEMP/plain"
          git -C "$RUNNER_TEMP/plain" remote add origin https://github.com/Sixian-Li/plain-backtest.git
          git -C "$RUNNER_TEMP/plain" sparse-checkout set data/processed/daily data/processed/calendars backtest/docs/release
          git -C "$RUNNER_TEMP/plain" fetch --depth 1 --filter=blob:none origin 36adf234a7b98e1bb30356350a9274d33e63f835
          git -C "$RUNNER_TEMP/plain" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/plain" rev-parse HEAD)" = 36adf234a7b98e1bb30356350a9274d33e63f835
          git -C "$RUNNER_TEMP/plain" rev-parse HEAD
          test "$(git -C "$RUNNER_TEMP/plain" hash-object backtest/docs/release/source_snapshot.json)" = cb0677768e9a64853c5d7aea2ee29a3ca7418946
      - name: Verify all source bytes and quality
        run: |
          mkdir -p "$RUNNER_TEMP/lab-output"
          node research/technical-lab/audit_universe.mjs research/technical-lab/source_inventory.json "$RUNNER_TEMP/plain" "$RUNNER_TEMP/lab-output/audit.json"
      - name: Replay frozen three events and market benchmark
        run: |
          node --max-old-space-size=6144 research/technical-lab/run_universe.mjs research/technical-lab/source_inventory.json "$RUNNER_TEMP/lab-output/audit.json" "$RUNNER_TEMP/plain" "$RUNNER_TEMP/lab-output/universe.json"
      - name: Verify reference calendar alignment
        run: |
          node research/technical-lab/calendar_event_audit.mjs "$RUNNER_TEMP/lab-output/audit.json" "$RUNNER_TEMP/lab-output/universe.json" "$RUNNER_TEMP/plain/data/processed/calendars/XNYS.csv" "$RUNNER_TEMP/lab-output/calendar-audit.json"
      - name: Preserve research-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-lab-universe-evidence
          path: ${{ runner.temp }}/lab-output/*.json
          retention-days: 14
          if-no-files-found: warn
