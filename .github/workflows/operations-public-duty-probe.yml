name: Operations public duty bounded live probe
on:
  pull_request:
    paths:
      - '.github/workflows/operations-public-duty-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B verification/operations-duty/public_duty.py --db "$RUNNER_TEMP/public-duty.sqlite" probe
