name: Alpha Lab Paper-Only Tests

on:
  pull_request:
    paths:
      - 'quantrade/alpha_lab/**'
      - 'tests/alpha_lab/**'
      - 'research/alpha_lab/**'
      - '.github/workflows/alpha_lab_paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile isolated alpha lab
        run: python -m compileall -q quantrade/alpha_lab tests/alpha_lab
      - name: Verify paper-only model
        run: python -m unittest discover -s tests/alpha_lab -p 'test_*.py' -v
