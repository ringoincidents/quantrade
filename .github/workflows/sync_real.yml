name: Real Portfolio Sync

# TASK-101 / LLMH-043
# 실계좌는 토스 Open API에서 조회만 하고, 현재 보유자산은 public repository에
# 커밋하지 않는다. 짧은 GitHub Actions OIDC 토큰으로 private LLM Holdings
# Runtime에 직접 전달한다. 주문/정정/취소 엔드포인트는 호출하지 않는다.
#
# KST 기준: 09:25 / 12:25 / 16:25 / 20:25
on:
  schedule:
    - cron: '25 0,3,7,11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROXY_URL: ${{ secrets.PROXY_URL }}
      TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
      TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
      LLM_HOLDINGS_RUNTIME_URL: https://llm-holdings-runtime-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Read Toss portfolio and push to private Runtime
        run: python runtime_portfolio_sync.py
