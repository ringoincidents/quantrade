name: CEO Operating Review

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ceo_operating_review.yml'

permissions:
  contents: write

concurrency:
  group: quantrade-ceo-operating-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout published state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout institutional review engine
        uses: actions/checkout@v4
        with:
          ref: architecture/p0-5-gap-audit
          path: .quantrade-arch
          persist-credentials: false

      - name: Download private HQ proposal outcomes when authenticated
        continue-on-error: true
        env:
          HOLDINGS_API_TOKEN: ${{ secrets.LLM_HOLDINGS_API_TOKEN }}
          HOLDINGS_RUNTIME_URL: https://llm-holdings-runtime-production.up.railway.app
        run: |
          if [ -z "$HOLDINGS_API_TOKEN" ]; then
            echo "LLM_HOLDINGS_API_TOKEN is not configured; CEO review continues without HQ feedback."
            exit 0
          fi
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 20 \
            -H "Authorization: Bearer $HOLDINGS_API_TOKEN" \
            "$HOLDINGS_RUNTIME_URL/clients/quantrade/ceo/proposal-outcomes" \
            -o hq_outcomes.json

      - name: Compile deterministic CEO operating review
        env:
          PYTHONPATH: .quantrade-arch
        run: |
          EXTRA_ARGS=""
          if [ -f hq_outcomes.json ]; then
            EXTRA_ARGS="--hq-outcomes hq_outcomes.json"
          fi
          python .quantrade-arch/scripts/run_ceo_operating_review.py \
            --decision-snapshot institutional_decision_snapshot.json \
            --history ceo_operating_history.json \
            --output ceo_improvement_proposals.json \
            $EXTRA_ARGS

      - name: Publish review state
        run: |
          git config user.name "quantrade-ceo-review"
          git config user.email "actions@github.com"
          git add ceo_operating_history.json ceo_improvement_proposals.json
          if git diff --cached --quiet; then
            echo "No CEO operating-review state change."
            exit 0
          fi
          git commit -m "ops: update CEO operating review"
          git push
