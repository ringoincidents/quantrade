name: Office public source compatibility probe
on:
  push:
    branches: [verification/private-office-auth-20261128]
    paths: ['verification/private-office/public_source_probe.py', '.github/workflows/office-public-source-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=verification/private-office:research/market_data_vault python verification/private-office/public_source_probe.py
