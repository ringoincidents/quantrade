name: GDP forecast research
on:
  pull_request:
    paths:
      - 'research/gdp_forecast/**'
      - '.github/workflows/gdp-forecast-research.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s research/gdp_forecast -p 'test_*.py' -v
