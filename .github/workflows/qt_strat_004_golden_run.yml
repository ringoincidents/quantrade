name: QT-STRAT-004 Golden Run

on:
  push:
    branches:
      - "research/llm-trading-frameworks-2026-10-05"
    paths:
      - "scripts/run_qt_strat_004.py"
      - ".github/workflows/qt_strat_004_golden_run.yml"

permissions:
  contents: write

jobs:
  golden-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "research/llm-trading-frameworks-2026-10-05"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify preregistration anchor exists
        run: |
          git cat-file -e 8ea6b3ff2a08466923bb78df49cdbfb26f83b599^{commit}
          git show 8ea6b3ff2a08466923bb78df49cdbfb26f83b599:research/experiments/QT-STRAT-004_PRE_REGISTRATION.md >/tmp/prereg.md
      - name: Install experiment dependency
        run: python -m pip install requests
      - name: Compile experiment
        run: |
          python -m compileall -q quantrade/capabilities scripts/run_qt_strat_004.py
      - name: Run frozen Golden Run
        run: python -m scripts.run_qt_strat_004
      - name: Verify generated artifacts
        run: |
          test -s research/experiments/QT-STRAT-004_RESULT.json
          test -s research/experiments/QT-STRAT-004_DATASET.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("research/experiments/QT-STRAT-004_RESULT.json").read_text())
          assert result["preregistration_commit"] == "8ea6b3ff2a08466923bb78df49cdbfb26f83b599"
          assert result["authority"]["model_called"] is False
          assert result["authority"]["execution_authorized"] is False
          assert result["selection"]["test_opened_only_for_selected"] is True
          assert result["pipeline_result"]["operational_success"] is True
          print("artifact verification: OK")
          PY
      - name: Upload immutable run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qt-strat-004-golden-run
          path: |
            research/experiments/QT-STRAT-004_RESULT.json
            research/experiments/QT-STRAT-004_DATASET.json
          if-no-files-found: error
      - name: Commit Golden Run evidence
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add research/experiments/QT-STRAT-004_RESULT.json
          git add research/experiments/QT-STRAT-004_DATASET.json
          if git diff --cached --quiet; then
            echo "No experiment artifact changes to commit."
          else
            git commit -m "experiment: record QT-STRAT-004 golden run evidence"
            git push origin HEAD:research/llm-trading-frameworks-2026-10-05
          fi
