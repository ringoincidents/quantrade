name: Technical Lab ALFRED source feasibility
on:
  pull_request:
    paths:
      - '.github/workflows/technical-lab-alfred-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded public source feasibility
        run: node research/technical-lab/probe_alfred_semiconductor.mjs
