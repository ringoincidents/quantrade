name: Investment Office Core Tests

on:
  pull_request:
    paths:
      - "quantrade/capabilities/investment_case.py"
      - "quantrade/capabilities/investment_case_evaluation.py"
      - "quantrade/capabilities/thesis_contract.py"
      - "quantrade/capabilities/thesis_contract_evaluation.py"
      - "quantrade/capabilities/fundamental_evidence.py"
      - "tests/capabilities/test_investment_case.py"
      - "tests/capabilities/test_thesis_contract.py"
      - "tests/capabilities/test_fundamental_evidence.py"
      - "research/precedents/2026-10-05_INVESTMENT_OFFICE_DECISION_ECONOMICS_DIRECTION.md"
  push:
    branches:
      - "direction/investment-office-decision-economics-2026-10-05"
    paths:
      - "quantrade/capabilities/investment_case.py"
      - "quantrade/capabilities/investment_case_evaluation.py"
      - "quantrade/capabilities/thesis_contract.py"
      - "quantrade/capabilities/thesis_contract_evaluation.py"
      - "quantrade/capabilities/fundamental_evidence.py"
      - "tests/capabilities/test_investment_case.py"
      - "tests/capabilities/test_thesis_contract.py"
      - "tests/capabilities/test_fundamental_evidence.py"
      - ".github/workflows/investment_case_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Investment Case capability
        run: python -m compileall -q quantrade/capabilities tests/capabilities
      - name: Run Investment Case tests
        run: python -m unittest tests.capabilities.test_investment_case -v
      - name: Run Thesis Contract tests
        run: python -m unittest tests.capabilities.test_thesis_contract -v
      - name: Run Point-in-Time Fundamental Evidence tests
        run: python -m unittest tests.capabilities.test_fundamental_evidence -v
      - name: Run existing capability regression suite
        run: python -m unittest discover -s tests/capabilities -p "test_*.py" -v
      - name: Run reference harness
        run: |
          python - <<'PY'
          import json
          from quantrade.capabilities.investment_case_evaluation import reference_cases
          from quantrade.capabilities.thesis_contract_evaluation import reference_thesis_contracts

          economics = reference_cases()
          thesis = reference_thesis_contracts()
          assert economics["authority"]["execution_authorized"] is False
          assert economics["authority"]["portfolio_proposal_created"] is False
          assert thesis["authority"]["canonical_evidence_created"] is False
          assert thesis["authority"]["thesis_truth_validated"] is False
          assert thesis["authority"]["execution_authorized"] is False
          print(json.dumps({"economics": economics, "thesis": thesis}, ensure_ascii=False, sort_keys=True))
          PY
