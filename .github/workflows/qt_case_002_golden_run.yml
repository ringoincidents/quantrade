name: QT-CASE-002 Cash-Flow Robustness Golden Run

on:
  push:
    branches:
      - "direction/investment-office-decision-economics-2026-10-05"
    paths:
      - "scripts/run_qt_case_002.py"
      - "tests/capabilities/test_qt_case_002_rules.py"
      - "quantrade/capabilities/cash_flow_valuation.py"
      - "quantrade/capabilities/fundamental_counter_research.py"
      - "quantrade/capabilities/dart_fundamental_provider.py"
      - "quantrade/capabilities/fundamental_evidence.py"
      - "quantrade/capabilities/investment_case.py"
      - "quantrade/capabilities/thesis_contract.py"
      - "quantrade/capabilities/portfolio_opportunity.py"
      - "quantrade/capabilities/risk_opinion.py"
      - ".github/workflows/qt_case_002_golden_run.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantrade-open-dart-live
  cancel-in-progress: false

jobs:
  golden-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "direction/investment-office-decision-economics-2026-10-05"
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify preregistration and QT-CASE-001 anchors
        shell: bash
        run: |
          git cat-file -e 63325f10b4e4da6d5daa1b9510dbe45cab157bcb^{commit}
          git merge-base --is-ancestor 63325f10b4e4da6d5daa1b9510dbe45cab157bcb HEAD
          test -f research/experiments/QT-CASE-002_PRE_REGISTRATION.md
          test -f research/experiments/QT-CASE-001_RESULT.json

      - name: Verify Open DART secret
        shell: bash
        run: |
          if [ -z "$OPEN_DART_API_KEY" ]; then
            echo "OPEN_DART_API_KEY is required for QT-CASE-002" >&2
            exit 1
          fi
          echo "OPEN_DART_API_KEY is configured."

      - name: Compile Golden Run
        run: |
          python -m compileall -q             quantrade/capabilities             scripts/run_qt_case_001.py             scripts/run_qt_case_002.py             tests/capabilities/test_cash_flow_valuation.py             tests/capabilities/test_fundamental_counter_research.py             tests/capabilities/test_qt_case_002_rules.py

      - name: Run frozen deterministic tests
        run: |
          python -m unittest tests.capabilities.test_cash_flow_valuation -v
          python -m unittest tests.capabilities.test_fundamental_counter_research -v
          python -m unittest tests.capabilities.test_qt_case_002_rules -v

      - name: Execute QT-CASE-002
        run: python -m scripts.run_qt_case_002

      - name: Verify result authority and cross-method invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("research/experiments/QT-CASE-002_RESULT.json").read_text()
          )
          assert result["experiment_id"] == "QT-CASE-002"
          assert result["preregistration_commit"] == "63325f10b4e4da6d5daa1b9510dbe45cab157bcb"
          assert result["operational_result"]["success"] is True
          assert result["operational_result"]["real_company_data"] is True
          assert result["operational_result"]["known_case_robustness_challenge"] is True
          assert result["operational_result"]["model_calls"] == 0
          assert result["operational_result"]["private_client_context_used"] is False
          assert result["source_integrity"]["price_after_case_cutoff_used"] is False
          assert result["cross_method"]["classification"] in {
              "CROSS_METHOD_CONFIRMED",
              "CROSS_METHOD_MIXED",
              "CROSS_METHOD_REJECTED",
          }
          assert result["counter_research"]["schema"] == "quantrade_fundamental_counter_research_v1"
          assert len(result["cash_flow"]["annual_history"]) == 4
          assert result["cash_flow"]["ttm_owner_cash_flow_proxy"] > 0
          assert result["cash_flow"]["ttm_owner_cash_flow_per_share"] > 0

          for scenario, values in result["cross_method"]["scenario_comparison"].items():
              robust = values["robust_lower_of_two_fair_value"]
              assert robust <= values["pe_fair_value"] + 1e-6
              assert robust <= values["dcf_fair_value"] + 1e-6

          authority = result["authority"]
          assert authority["target_weight_set"] is False
          assert authority["committee_decision_created"] is False
          assert authority["founder_decision_created"] is False
          assert authority["decision_plan_created"] is False
          assert authority["paper_authorized"] is False
          assert authority["execution_authorized"] is False
          assert authority["live_order_possible"] is False

          print(json.dumps({
              "current_price": result["case"]["current_price"],
              "ttm_owner_cash_flow_proxy": result["cash_flow"]["ttm_owner_cash_flow_proxy"],
              "ttm_owner_cash_flow_per_share": result["cash_flow"]["ttm_owner_cash_flow_per_share"],
              "dcf_weighted_fair_value": result["cash_flow_dcf"]["metrics"]["weighted_fair_value"],
              "dcf_expected_return_pct": result["cash_flow_dcf"]["metrics"]["expected_return_pct"],
              "cross_method_classification": result["cross_method"]["classification"],
              "robust_weighted_fair_value": result["robust_investment_case_economics"]["metrics"]["weighted_fair_value"],
              "robust_expected_return_pct": result["robust_investment_case_economics"]["metrics"]["expected_return_pct"],
              "counter_flags": result["counter_research"]["flags"],
              "portfolio_status": result["portfolio_sandbox"]["status"],
              "risk_status": None if result["risk_sandbox"] is None else result["risk_sandbox"]["status"],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload immutable Golden Run artifact
        uses: actions/upload-artifact@v4
        with:
          name: qt-case-002-golden-run
          path: |
            /tmp/QT-CASE-002_FULL_ARTIFACT.json
            research/experiments/QT-CASE-002_RESULT.json
            research/experiments/QT-CASE-002_RESULT_REPORT.md
          if-no-files-found: error

      - name: Commit compact result evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/experiments/QT-CASE-002_RESULT.json             research/experiments/QT-CASE-002_RESULT_REPORT.md
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "experiment: record QT-CASE-002 Golden Run evidence"
            git push origin HEAD:direction/investment-office-decision-economics-2026-10-05
          fi
