name: Thesis review bridge verification
on:
  pull_request:
    branches: [direction/investment-office-decision-economics-2026-10-05]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical thesis and synthetic bridge tests
        run: |
          export PYTHONPATH="$PWD"
          python verification/counter-review/test_thesis_preview.py -v
