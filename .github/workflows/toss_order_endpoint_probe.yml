name: Toss Order Endpoint Probe
# 2026-08-09, 방향성 세션 지시: GET /api/v1/orders, GET /api/v1/sellable-quantity
# 조회 엔드포인트가 인증/헤더/프록시 IP 화이트리스트 하에서 정상 동작하는지만
# 확인하는 1회성 진단. 주문 실행 코드는 이 워크플로/스크립트 어디에도 없다.
#
# workflow_dispatch 전용 — 스케줄로 돌지 않는다(반복 조회할 이유가 없는 진단성
# 호출). 커밋 스텝이 없다 — 아무 파일도 저장소에 남기지 않고, 결과는 잡 로그로만
# 확인한다(토스_주문API_스펙조사_2026-08-05.md와의 대조는 로그를 보고 사람/세션이
# 수행).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROXY_URL: ${{ secrets.PROXY_URL }}
      TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
      TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python toss_order_endpoint_probe.py
