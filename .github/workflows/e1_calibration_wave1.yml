name: E1 Calibration Wave 1

on:
  pull_request:
    branches:
      - architecture/p0-5-gap-audit
    paths:
      - ".github/workflows/e1_calibration_wave1.yml"

permissions:
  contents: read

jobs:
  e1-wave1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require experiment secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is not configured."
            exit 2
          fi
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Run six-task paired calibration wave
        run: |
          python scripts/run_e1_live.py \
            --tasks ALL \
            --repeats 1 \
            --model gemini-3.5-flash-lite \
            --pace-seconds 5 \
            --db e1_wave1.sqlite3 \
            --report e1_wave1_report.json
      - name: Upload experimental record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-calibration-wave1
          path: |
            e1_wave1.sqlite3
            e1_wave1_report.json
          if-no-files-found: warn
          retention-days: 30
