name: Autoexec Stop Fast-Path
# 2026-08-08: 킬스위치(/autoexec_stop) 긴급 반영 전용. poll.yml(전체 명령어 처리)과
# 별개의 독립 경로로 같은 최소 간격(5분)에 돈다 — 목적은 "더 자주 도는 것"이
# 아니라, GitHub Actions 스케줄 지연이 poll.yml 쪽에만 몰릴 확률을 낮추는
# 이중화다. telegram_offset.json은 절대 건드리지 않는다(autoexec_stop_fast.py
# 상단 설명 참고) — 정식 처리(오프셋 전진, 중복확인 회신 등)는 여전히 poll.yml만
# 담당한다.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python autoexec_stop_fast.py
      # poll.yml과 같은 5분 간격으로 돌고 poll.yml도 이제 autoexec_state.json을
      # 커밋하므로(2026-08-08, 상태 미영속화 버그 수정), push 충돌 가능성이 있다.
      # sync_real.yml에서 검증된 rebase+재시도 패턴을 그대로 따른다.
      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ ! -f autoexec_state.json ]; then echo "상태 파일 없음(발동 없었음)"; exit 0; fi
          git add autoexec_state.json
          git diff --quiet && git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "Autoexec stop fast-path"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "push 성공 (시도 $attempt)"; exit 0; fi
            echo "push 거부됨 - rebase 후 재시도 ($attempt/5)"
            git pull --rebase origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "5회 시도 후에도 push 실패"; exit 1
