name: Backtest Engine
on:
  workflow_dispatch:
    inputs:
      count:
        description: '일봉 개수 (기본 약 3년치)'
        required: false
        default: '750'
      krx:
        description: 'KRX 종목코드 (공백 구분, 예: 005930 373220)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run backtest
        env:
          COUNT: ${{ github.event.inputs.count }}
          KRX: ${{ github.event.inputs.krx }}
        run: python backtest.py --count "$COUNT" --krx $KRX
      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backtest_report.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Backtest report update"
          git push
