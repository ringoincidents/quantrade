name: Backtest Engine
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'KRX/미국주식 일봉 개수 (기본 약 6년치, 크립토는 --crypto-count로 별도 상장시점까지 조회)'
        required: false
        default: '1500'
      krx:
        description: 'KRX 종목코드 (공백 구분). 비워두면 KRX_MARKET_CAP_TOP 기본 유니버스 사용'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run backtest
        env:
          COUNT: ${{ github.event.inputs.count }}
          KRX: ${{ github.event.inputs.krx }}
        run: |
          if [ -n "$KRX" ]; then
            python backtest.py --count "$COUNT" --krx $KRX
          else
            python backtest.py --count "$COUNT"
          fi
      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backtest_report.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Backtest report update"
          git push
