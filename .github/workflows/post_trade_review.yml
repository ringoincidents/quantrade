name: Post-Trade Review (retired public path)

# TASK-101: this scheduled workflow depended on repository-backed current
# holdings. It is retired rather than silently reviewing stale public state.
# Performance & Learning will be reconnected to private Runtime state separately.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Retired: public-repository post-trade review is disabled."
          echo "Current holdings are private Runtime state."
